# Render Blueprint — from the repo root: `render.yaml` is also copied to the root.
# Use this file as a reference or point Render at services/api if the dashboard allows it.
services:
  - type: web
    name: saha-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: SEARCH_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini/gemini-2.0-flash
      - key: CACHE_DIR
        value: /app/.cache
