app = "saha-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  # Build from the repository root so docs/ is included:
  #   fly deploy --config services/api/fly.toml --dockerfile services/api/Dockerfile --path .

[env]
  CACHE_DIR = "/app/.cache"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    [http_service.checks.health]
      grace_period = "10s"
      interval = "30s"
      method = "GET"
      path = "/health"
      timeout = "5s"
