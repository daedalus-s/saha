services:
  - type: web
    name: saha-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: SEARCH_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini/gemini-2.0-flash
      - key: CACHE_DIR
        value: /app/.cache
